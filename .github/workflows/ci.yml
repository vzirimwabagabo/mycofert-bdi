# Continuous integration for MYCOFERT Burundi.
# Runs on every push and pull request to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mycofert
          POSTGRES_PASSWORD: mycofert_dev
          POSTGRES_DB: mycofert
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://mycofert:mycofert_dev@127.0.0.1:5432/mycofert?schema=public
      DIRECT_URL: postgresql://mycofert:mycofert_dev@127.0.0.1:5432/mycofert?schema=public
      ADMIN_PASSCODE: ci-test-passcode-secure
      ADMIN_SESSION_SECRET: ci-test-session-secret-0123456789abcdef0123456789

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
